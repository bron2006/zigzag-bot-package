<html><head><meta charset="UTF-8"><style>
    body {{ background:#0f0f0f; color:#e0e0e0; font-family:sans-serif; padding:20px; display:flex; justify-content:center; }}
    .card {{ background:#1a1a1a; border-radius:16px; padding:24px; border:1px solid #333; width:520px; }}
    h1 {{ color:#3390ec; border-bottom:1px solid #333; padding-bottom:10px; font-size:22px; }}
    .stat {{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #252525; }}
    .val {{ font-weight:bold; color:#fff; }}
    .ok {{ color:#4caf50; }} .info {{ color:#3390ec; }} .err {{ color:#ef5350; }}
</style></head>
<body><div class="card">
    <h1>{health_title}</h1>
    <div class="stat"><span>status:</span><span class="val {status_class}">{overall_status}</span></div>
    <div class="stat"><span>{quote_feed_label}:</span><span class="val {quote_feed_class}">{quote_label}</span></div>
    <div class="stat"><span>{telegram_bot_label}:</span><span class="val {telegram_class}">{tg_status}</span></div>
    <div class="stat"><span>{sse_signal_label}:</span><span class="val info">{sse_signal_count}</span></div>
    <div class="stat"><span>{sse_price_label}:</span><span class="val info">{sse_price_count}</span></div>
    <div class="stat"><span>{live_prices_label}:</span><span class="val">{live_prices_count}</span></div>
    <div class="stat"><span>{stale_prices_label}:</span><span class="val">{stale_count}</span></div>
    <p style='text-align:center;color:#555;font-size:11px;margin-top:20px;'>{updated_label}: {updated_at}</p>
</div></body></html>
