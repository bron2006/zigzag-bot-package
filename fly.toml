app = "zigzag-bot-package"
primary_region = "ams"

[env]
  PAPER_STOP_JOURNAL_PATH = "/data/paper_stops_v1.sqlite3"
  LEGACY_SIGNAL_TEST_ENABLED = "false"
  PAPER_STOP_ACCEPT_ENTRIES = "false"
  FORWARD_STRUCTURE_RESEARCH_PATH = "/data/forward_structure_v1.sqlite3"

[[mounts]]
  source = "signals_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
